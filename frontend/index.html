
<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizician</title>
<link rel="icon" type="image/x-icon" href="favicon.ico.png">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>



<!-- NAVBAR -->

<header class="navbar">
  <div class="logo">Quizician</div>

  <nav>
    <a href="#" id="homeBtn" class="active">Home</a>
    <a href="#" id="quizBtn">Quizzes</a>
    <a href="#" id="catBtn">Categories</a>
  </nav>
</header>


<!-- HERO -->
<section class="hero">

  <div class="bg-shape left"></div>
  <div class="bg-shape right"></div>

  <div class="hero-content">

    <div class="input-box">
    <span class="icon"><i class="fa-solid fa-user"></i></span>
      <input id="username" placeholder="Enter your name" />
    </div>

    <h1>
      Play <span>Smart.</span><br>
      Think <span>Sharp.</span>
    </h1>

    <p>
      Challenge yourself with exciting quizzes
      and boost your knowledge.
    </p>

    <button class="start-btn" onclick="startQuiz()">Start Quiz</button>

  </div>

</section>

<!-- CATEGORIES -->
<section class="categories">

  <div class="cat-title">
    <span></span>
    <h2>Categories</h2>
    <span></span>
  </div>

  <div class="sparkle">✦</div>

  <div class="card-grid">

    
<div class="card" onclick="startQuiz('gk')">
  <div class="circle"><i class="fa-solid fa-book"></i></div>
  GK
</div>

<div class="card" onclick="startQuiz('science')">
  <div class="circle"><i class="fa-solid fa-flask"></i></div>
  Science
</div>

<div class="card" onclick="startQuiz('history')">
  <div class="circle"><i class="fa-solid fa-landmark"></i></div>
  History
</div>

<div class="card" onclick="startQuiz('gk')">
  <div class="circle"><i class="fa-solid fa-newspaper"></i></div>
  Current Affairs
</div>



  </div>

</section>



<section id="quiz" class="quiz-page" style="display:none;">

  <div class="quiz-card">

    <!-- Top Bar -->
    <div class="quiz-top">
      <div class="progress-text">
        <i class="fa-solid fa-clipboard"></i>
        <span id="progress"></span>
      </div>

      <div class="timer-box">
        <i class="fa-solid fa-clock"></i>
        <span id="timer"></span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div id="progressFill"></div>
    </div>

    <!-- Question -->
    <div class="question-box">
      <div class="question-icon">🏛️</div>
      <h2 id="question"></h2>
    </div>

    <!-- Answers -->
    <div id="answers" class="answers"></div>

    <!-- Button -->
    <button id="nextBtn" class="next-btn">
      Next <i class="fa-solid fa-angle-right"></i>
    </button>

  </div>

</section>






<section id="result" class="result-page" style="display:none;">

  <div class="result-card fade-in">

    <div class="trophy">🏆</div>

    <h2>Quiz Result 🎯</h2>

    <!-- Stats -->
    <div class="stats">

      <div class="stat-box">
        <i class="fa-solid fa-star"></i>
        <p>Score</p>
        <h3 id="score"></h3>
      </div>

      <div class="stat-box">
        <i class="fa-solid fa-check"></i>
        <p>Accuracy</p>
        <h3 id="accuracy"></h3>
      </div>

      <div class="stat-box">
        <i class="fa-solid fa-clock"></i>
        <p>Total Time</p>
        <h3 id="timeTaken"></h3>
      </div>

    </div>

    <!-- Review -->
    <div id="review"></div>

    <button class="play-btn" onclick="restartQuiz()">
      <i class="fa-solid fa-rotate"></i> Play Again
    </button>

  </div>

</section>











<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


<script src="script.js"></script>
</body>
</html>
